# A whole bootable disk: MBR, GRUB, and one ext4 partition holding both /boot
# and the root filesystem.
#
# disk-signature fixes the MBR id, which makes the partition's PARTUUID
# predictable (<signature>-01). That is what grub.cfg passes as root=, so the
# image boots the same whether the disk shows up as /dev/sda on VirtualBox's
# SATA controller or /dev/vda on QEMU's virtio one.

image disk.img {
	hdimage {
		disk-signature = 0x6D70656E
	}

	partition boot {
		in-partition-table = "no"
		image = "boot.img"
		offset = 0
		size = 512
		holes = {"(440; 512)"}
	}

	partition grub {
		in-partition-table = "no"
		image = "grub-disk.img"
		offset = 512
	}

	partition root {
		partition-type = 0x83
		bootable = "true"
		image = "rootfs.ext2"
	}
}
