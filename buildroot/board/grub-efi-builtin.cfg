# Embedded into the EFI core image. Unlike the BIOS side there is no prefix to
# inherit: GRUB starts at /EFI/BOOT, while the real menu lives with the kernel
# at /boot/grub. EFI only ever boots the ISO here — the disk image is MBR and
# BIOS-only — so the CD can be named outright.
set root=(cd0)
set prefix=($root)/boot/grub
configfile ($root)/boot/grub/grub.cfg
