# Boot menu for the live ISO. Buildroot substitutes __KERNEL_PATH__ and
# __INITRD_PATH__ when it assembles the image.
#
# rdinit, not init: the root here *is* the initramfs, and the kernel runs /init
# from it unless told otherwise. Ours is at /sbin/init, like on a real root.
#
# Both console= arguments are deliberate. The last one wins for /dev/console, so
# the screen stays the interactive console while the kernel log also reaches the
# serial port, where it can be captured from outside the VM.
set default="0"
set timeout="5"

menuentry "master penguin linux (live)" {
	linux __KERNEL_PATH__ rdinit=/sbin/init console=ttyS0,115200 console=tty1
	initrd __INITRD_PATH__
}

menuentry "master penguin linux (live, screen only)" {
	linux __KERNEL_PATH__ rdinit=/sbin/init console=tty1
	initrd __INITRD_PATH__
}
