# Services for mpinit (/sbin/init).
#
#   sysinit <cmd>   run once, to completion, before anything else starts
#   respawn <cmd>   keep running, with a controlling terminal (interactive)
#   daemon  <cmd>   keep running, without one (background services)

sysinit /etc/init.d/rcS
daemon  /usr/bin/start-weston
respawn /bin/sh
