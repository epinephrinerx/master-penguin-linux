# Services for mpinit (/sbin/init).
#
#   sysinit <cmd>   run once, to completion, before anything else starts
#   respawn <cmd>   keep running; restart it whenever it exits
#
# Lines are split on whitespace and exec'd directly, so there is no shell here:
# no globs, no pipes, no quoting. Put anything fancier in a script.

sysinit /etc/init.d/rcS
respawn /bin/sh
