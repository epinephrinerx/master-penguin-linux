# R-10: the installer starts in Thai, and the choice carries into the
# installed system.
#
# Calamares takes its initial language from the locale it was launched in, so
# the live session sets LANG=th_TH.UTF-8 and the desktop launcher passes it
# through. The language dropdown on the welcome page overrides it, and the
# override applies to the installed system too — pick English here and the
# installed desktop comes up in English.
---
region: "Asia"
zone:   "Bangkok"

# No GeoIP lookup. It would guess the region from the IP address, which is
# wrong on a VPN, wrong in a datacentre, and requires a network the installer
# does not otherwise need. Asia/Bangkok is the right default for who this is
# for, and the map on the page is there for everyone else.
