# What gets mounted into the target before anything is run inside it.
#
# This file did not exist, and that is what made the install fail with
#
#   /usr/sbin/mkinitramfs: 195: cannot create /dev/null: Permission denied
#   E: no ldd around - install libc-bin
#   update-initramfs: failed for /boot/initrd.img-7.0.0-31-generic with 1
#
# The mount module has no built-in list. Its own code says so:
#
#   extra_mounts = libcalamares.job.configuration.get("extraMounts") or []
#   if not extra_mounts:
#       warning("No extra mounts defined. Does mount.conf exist?")
#
# So the target got its root filesystem and nothing else: no /dev, no /proc,
# no /sys. Everything after that is a consequence of one missing thing.
# "no ldd around" and "No zstd in /usr/bin:/sbin:/bin" are not missing
# packages -- both tools are installed. The scripts test for them with
# `command -v ldd >/dev/null`, the redirect to a /dev/null that is not there
# fails, the test reports not-found, and the message blames the package.
#
# Mounts are applied in lexical order of mountPoint, which is why /dev comes
# before /dev/pts and /run before /run/udev without anything having to say so.
---
extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc

    - device: sys
      fs: sysfs
      mountPoint: /sys

    # rbind rather than bind: a plain bind takes the /dev directory and none
    # of the filesystems mounted inside it, so /dev/pts and /dev/shm would be
    # left behind. Anything that wants a pty in the target -- debconf, and
    # apt when netinstall has packages to fetch -- needs them.
    - device: /dev
      mountPoint: /dev
      options: [ rbind ]

    - device: tmpfs
      fs: tmpfs
      mountPoint: /run

    # grub-probe walks this to work out which device it is installing to.
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]

    # R-06. efibootmgr writes the boot entry through this, and without it
    # bootloader installation on an EFI machine puts the files in place and
    # then fails to register them -- an install that finishes and then boots
    # to nothing. Mounted only when the firmware is actually EFI; the module
    # drops entries marked this way on a BIOS machine.
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

mountOptions:
    - filesystem: default
      options: [ defaults ]

    - filesystem: ext4
      options: [ defaults ]
      ssdOptions: [ discard ]

    - filesystem: btrfs
      options: [ defaults, compress=zstd ]
      ssdOptions: [ discard=async ]

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
