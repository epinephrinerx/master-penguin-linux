# The desktop and software picker.
#
# This page kept coming up empty, through three different explanations. The
# first two were real faults and neither was the one that mattered:
#
#   1. The list was a bare sequence at the top of its own file. Calamares 3.3
#      wants it under a "groups" key; 3.2 did not. Fixed, page still empty.
#   2. netinstall.conf pointed at that file with "groupsFilePath", which is
#      not a key this module has ever had. Fixed by inlining the list, page
#      still empty.
#
# The third is this one. The list is read through "groupsUrl", and the special
# value "local" is what says "the list is in this file, under groups":
#
#     SourceItem SourceItem::makeSourceItem( const QString& groupsUrl, ... )
#     {
#         if ( groupsUrl == QStringLiteral( "local" ) )
#             return SourceItem { QUrl(), configurationMap.value( "groups" ).toList() };
#         ...
#     }
#
# With no groupsUrl at all the queue is empty and the module says so, in a
# line that reads like success rather than a problem:
#
#     Loading netinstall from 0 alternate sources.
#     ViewModule "netinstall@netinstall" loading complete.
#
# Nothing warns, nothing fails, and the page draws its column headings over
# an empty model. The page's own title and sidebar label come from a
# different part of the config, so they appeared correctly the whole time --
# which is what made it look like the list was being read and rejected.
#
# A note on how the first two were diagnosed, because the method was wrong:
# grepping the compiled module for key names. That said groupsUrl did not
# exist in this build, and it does. Reading the version's own source settled
# in one minute what three builds had not.
#
# Two rules the list itself has to keep:
#
#   1. Unticking everything still leaves a working system. Nothing here is
#      load-bearing -- the disc already carries a desktop, a browser, a mail
#      client, a file manager, a terminal, media codecs, printing and all
#      three package managers. That is also why required is false: a failure
#      on this page must not be able to stop an install.
#   2. Every group says what it costs, because somebody on a slow connection
#      is deciding how long they are willing to wait. Those figures are
#      measured, not estimated -- `apt-get install -s` against the built
#      chroot, summing the Size field of everything it says it would fetch.
#
# Two things about this file that were wrong and are worth writing down,
# because both looked like display bugs and neither was:
#
#   name[th] and description[th] do nothing here. The page title and the
#   sidebar label are TranslatedStrings and honour them, which is why those
#   two appeared in Thai and made it look as though the rest should follow.
#   A group's own text is not:
#
#       , m_name( Calamares::getString( groupData, "name" ) )
#       , m_description( Calamares::getString( groupData, "description" ) )
#
#   So the only way Thai reaches this page is inside the one string that is
#   actually drawn, which is what these now are.
#
#   An immutable row has no checkbox at all, rather than a ticked one that
#   cannot be changed:
#
#       case Qt::CheckStateRole:
#           return item->isImmutable() ? QVariant() : item->isSelected();
#
#   Next to GNOME and KDE, which do have boxes, "XFCE — installed" therefore
#   read as "not selected". The rows are still immutable -- unticking
#   something that is already in the squashfs would be a lie either way --
#   but they now say in their own name that they are always installed.
---
label:
    sidebar: "Software"
    sidebar[th]: "ซอฟต์แวร์"
    title: "Choose what to install"
    title[th]: "เลือกสิ่งที่จะติดตั้ง"

# "local" means: the list is below, in this file.
groupsUrl: local

required: false

groups:
  - name: "เดสก์ท็อป · Desktop environment"
    description: "XFCE อยู่ในแผ่นแล้ว ตัวอื่นจะดาวน์โหลดตอนนี้ จึงต้องต่ออินเทอร์เน็ต · XFCE is on the disc already. The others are downloaded now, so they need a network connection."
    selected: true
    hidden: false
    expanded: true
    subgroups:
      - name: "XFCE — อยู่ในแผ่น ติดตั้งให้เสมอ"
        description: "เบาและเร็ว อยู่ในแผ่นแล้ว ไม่ต้องดาวน์โหลด · Light and quick. Already here, nothing to download."
        selected: true
        critical: false
        immutable: true
        packages:
          - xfce4-session

      - name: "GNOME — ประมาณ 10 MB"
        description: "หน้าตาแบบ Ubuntu มาตรฐาน ส่วนใหญ่อยู่ในแผ่นแล้วจึงดาวน์โหลดน้อย แต่จะนำ GDM กลับมาแทน LightDM ที่หน้าล็อกอิน · What stock Ubuntu looks like. Most of it is on the disc already, so this is a small download — but it brings back GDM, which will replace LightDM as the login screen."
        selected: false
        critical: false
        packages:
          - gnome-shell
          - gnome-session
          - gnome-control-center
          - nautilus
          - gnome-terminal
          - gdm3

      - name: "KDE Plasma — ประมาณ 330 MB"
        description: "ปรับแต่งได้ละเอียด และหน้าตาเรียบร้อยที่สุดตั้งแต่ติดตั้งเสร็จ · Highly configurable, and the most finished-looking out of the box."
        selected: false
        critical: false
        packages:
          - kde-plasma-desktop
          - dolphin
          - konsole
          - kate
          - sddm

  - name: "มีอยู่ในแผ่นแล้ว · Already on the disc"
    description: "ติดตั้งให้เสมอ ไม่ว่าจะมีเน็ตหรือไม่ แสดงไว้เพื่อให้เห็นว่ามีอะไรบ้าง · Installed whether or not there is a network. Listed so you can see what is included."
    selected: true
    hidden: false
    expanded: false
    subgroups:
      - name: "เล่นสื่อและตัวถอดรหัส — ติดตั้งให้เสมอ"
        description: "VLC และตัวถอดรหัสสำหรับไฟล์วิดีโอและเสียงทั่วไป · VLC and the codecs for ordinary video and audio files."
        selected: true
        immutable: true
        packages:
          - vlc

      - name: "การพิมพ์และสแกน — ติดตั้งให้เสมอ"
        description: "CUPS ไดรเวอร์เครื่องพิมพ์ที่พบบ่อย และการสแกน · CUPS, drivers for common printers, and scanner support."
        selected: true
        immutable: true
        packages:
          - simple-scan

  - name: "ตัวเลือกเพิ่มเติม ดาวน์โหลดตอนติดตั้ง · Optional"
    description: "ไม่จำเป็นต่อการทำงานของระบบ หากไม่มีอินเทอร์เน็ตจะข้ามรายการเหล่านี้ · None of this is needed for the system to work. With no network connection these are skipped."
    selected: false
    hidden: false
    expanded: true
    subgroups:
      - name: "ชุดสำนักงาน — ประมาณ 290 MB"
        description: "LibreOffice พร้อมการตรวจสะกดและการตัดคำภาษาไทย · LibreOffice, with Thai spelling and hyphenation."
        selected: false
        packages:
          - libreoffice
          - libreoffice-l10n-th

      - name: "งานกราฟิก — ประมาณ 70 MB"
        description: "GIMP สำหรับรูปภาพ Inkscape สำหรับงานวาด · GIMP for photographs, Inkscape for drawing."
        selected: false
        packages:
          - gimp
          - inkscape

      - name: "เครื่องมือพัฒนา — ประมาณ 75 MB"
        description: "คอมไพเลอร์ git และเครื่องมือแพ็กเกจของ Python · Compilers, git, and Python packaging."
        selected: false
        packages:
          - build-essential
          - git
          - python3-pip

      - name: "สำรองข้อมูล — ประมาณ 5 MB"
        description: "Timeshift เก็บสแนปช็อตให้ย้อนกลับได้ · Timeshift, which takes snapshots you can roll back to."
        selected: false
        packages:
          - timeshift

      - name: "การเข้าถึงระยะไกล — ประมาณ 2 MB"
        description: "เซิร์ฟเวอร์ SSH เพื่อให้เข้าถึงเครื่องนี้ได้ และ Remmina เพื่อเข้าถึงเครื่องอื่น · An SSH server for reaching this machine, and Remmina for reaching others."
        selected: false
        packages:
          - openssh-server
          - remmina
