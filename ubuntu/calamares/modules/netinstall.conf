# The desktop and software picker.
#
# This page kept coming up empty, through three different explanations. The
# first two were real faults and neither was the one that mattered:
#
#   1. The list was a bare sequence at the top of its own file. Calamares 3.3
#      wants it under a "groups" key; 3.2 did not. Fixed, page still empty.
#   2. netinstall.conf pointed at that file with "groupsFilePath", which is
#      not a key this module has ever had. Fixed by inlining the list, page
#      still empty.
#
# The third is this one. The list is read through "groupsUrl", and the special
# value "local" is what says "the list is in this file, under groups":
#
#     SourceItem SourceItem::makeSourceItem( const QString& groupsUrl, ... )
#     {
#         if ( groupsUrl == QStringLiteral( "local" ) )
#             return SourceItem { QUrl(), configurationMap.value( "groups" ).toList() };
#         ...
#     }
#
# With no groupsUrl at all the queue is empty and the module says so, in a
# line that reads like success rather than a problem:
#
#     Loading netinstall from 0 alternate sources.
#     ViewModule "netinstall@netinstall" loading complete.
#
# Nothing warns, nothing fails, and the page draws its column headings over
# an empty model. The page's own title and sidebar label come from a
# different part of the config, so they appeared correctly the whole time --
# which is what made it look like the list was being read and rejected.
#
# A note on how the first two were diagnosed, because the method was wrong:
# grepping the compiled module for key names. That said groupsUrl did not
# exist in this build, and it does. Reading the version's own source settled
# in one minute what three builds had not.
#
# Two rules the list itself has to keep:
#
#   1. Unticking everything still leaves a working system. Nothing here is
#      load-bearing -- the disc already carries a desktop, a browser, a mail
#      client, a file manager, a terminal, media codecs, printing and all
#      three package managers. That is also why required is false: a failure
#      on this page must not be able to stop an install.
#   2. Every group says what it costs, because somebody on a slow connection
#      is deciding how long they are willing to wait. Those figures are
#      measured, not estimated -- `apt-get install -s` against the built
#      chroot, summing the Size field of everything it says it would fetch.
#
# Groups marked immutable are already on the disc. They are shown ticked and
# locked so people can see what they are getting rather than wonder where it
# came from.
---
label:
    sidebar: "Software"
    sidebar[th]: "ซอฟต์แวร์"
    title: "Choose what to install"
    title[th]: "เลือกสิ่งที่จะติดตั้ง"

# "local" means: the list is below, in this file.
groupsUrl: local

required: false

groups:
  - name: "Desktop environment"
    name[th]: "เดสก์ท็อป"
    description: "XFCE is on the disc already. The others are downloaded now, so they need a network connection."
    description[th]: "XFCE อยู่ในแผ่นแล้ว ตัวอื่นจะดาวน์โหลดตอนนี้ จึงต้องต่ออินเทอร์เน็ต"
    selected: true
    hidden: false
    expanded: true
    subgroups:
      - name: "XFCE — installed"
        name[th]: "XFCE — ติดตั้งแล้ว"
        description: "Light and quick. Already here, nothing to download."
        description[th]: "เบาและเร็ว อยู่ในแผ่นแล้ว ไม่ต้องดาวน์โหลด"
        selected: true
        critical: false
        immutable: true
        packages:
          - xfce4-session

      - name: "GNOME — about 10 MB"
        name[th]: "GNOME — ประมาณ 10 MB"
        description: "What stock Ubuntu looks like. Most of it is on the disc already, so this is a small download — but it brings back GDM, which will replace LightDM as the login screen."
        description[th]: "หน้าตาแบบ Ubuntu มาตรฐาน ส่วนใหญ่อยู่ในแผ่นแล้วจึงดาวน์โหลดน้อย แต่จะนำ GDM กลับมาแทน LightDM ที่หน้าล็อกอิน"
        selected: false
        critical: false
        packages:
          - gnome-shell
          - gnome-session
          - gnome-control-center
          - nautilus
          - gnome-terminal
          - gdm3

      - name: "KDE Plasma — about 330 MB"
        name[th]: "KDE Plasma — ประมาณ 330 MB"
        description: "Highly configurable, and the most finished-looking out of the box."
        description[th]: "ปรับแต่งได้ละเอียด และหน้าตาเรียบร้อยที่สุดตั้งแต่ติดตั้งเสร็จ"
        selected: false
        critical: false
        packages:
          - kde-plasma-desktop
          - dolphin
          - konsole
          - kate
          - sddm

  - name: "Already on the disc"
    name[th]: "มีอยู่ในแผ่นแล้ว"
    description: "Installed whether or not there is a network. Listed so you can see what is included."
    description[th]: "ติดตั้งให้เสมอ ไม่ว่าจะมีเน็ตหรือไม่ แสดงไว้เพื่อให้เห็นว่ามีอะไรบ้าง"
    selected: true
    hidden: false
    expanded: false
    subgroups:
      - name: "Media playback and codecs"
        name[th]: "เล่นสื่อและตัวถอดรหัส"
        description: "VLC and the codecs for ordinary video and audio files."
        description[th]: "VLC และตัวถอดรหัสสำหรับไฟล์วิดีโอและเสียงทั่วไป"
        selected: true
        immutable: true
        packages:
          - vlc

      - name: "Printing and scanning"
        name[th]: "การพิมพ์และสแกน"
        description: "CUPS, drivers for common printers, and scanner support."
        description[th]: "CUPS ไดรเวอร์เครื่องพิมพ์ที่พบบ่อย และการสแกน"
        selected: true
        immutable: true
        packages:
          - simple-scan

  - name: "Optional — downloaded during installation"
    name[th]: "ตัวเลือกเพิ่มเติม — ดาวน์โหลดระหว่างติดตั้ง"
    description: "None of this is needed for the system to work. With no network connection these are skipped."
    description[th]: "ไม่จำเป็นต่อการทำงานของระบบ หากไม่มีอินเทอร์เน็ตจะข้ามรายการเหล่านี้"
    selected: false
    hidden: false
    expanded: true
    subgroups:
      - name: "Office — about 290 MB"
        name[th]: "ชุดสำนักงาน — ประมาณ 290 MB"
        description: "LibreOffice, with Thai spelling and hyphenation."
        description[th]: "LibreOffice พร้อมการตรวจสะกดและการตัดคำภาษาไทย"
        selected: false
        packages:
          - libreoffice
          - libreoffice-l10n-th

      - name: "Graphics — about 70 MB"
        name[th]: "งานกราฟิก — ประมาณ 70 MB"
        description: "GIMP for photographs, Inkscape for drawing."
        description[th]: "GIMP สำหรับรูปภาพ Inkscape สำหรับงานวาด"
        selected: false
        packages:
          - gimp
          - inkscape

      - name: "Development — about 75 MB"
        name[th]: "เครื่องมือพัฒนา — ประมาณ 75 MB"
        description: "Compilers, git, and Python packaging."
        description[th]: "คอมไพเลอร์ git และเครื่องมือแพ็กเกจของ Python"
        selected: false
        packages:
          - build-essential
          - git
          - python3-pip

      - name: "Backup — about 5 MB"
        name[th]: "สำรองข้อมูล — ประมาณ 5 MB"
        description: "Timeshift, which takes snapshots you can roll back to."
        description[th]: "Timeshift เก็บสแนปช็อตให้ย้อนกลับได้"
        selected: false
        packages:
          - timeshift

      - name: "Remote access — about 2 MB"
        name[th]: "การเข้าถึงระยะไกล — ประมาณ 2 MB"
        description: "An SSH server for reaching this machine, and Remmina for reaching others."
        description[th]: "เซิร์ฟเวอร์ SSH เพื่อให้เข้าถึงเครื่องนี้ได้ และ Remmina เพื่อเข้าถึงเครื่องอื่น"
        selected: false
        packages:
          - openssh-server
          - remmina
