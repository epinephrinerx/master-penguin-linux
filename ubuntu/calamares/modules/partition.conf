# Partitioning. R-06 (EFI), R-12 (encryption) and R-13 (swap).
#
# The install failed here, and not in a way that said so. "Erase disk" built
# a GPT table, created the 512 MiB EFI partition -- and stopped. The job list
# went straight from partitioning to mount:
#
#     Starting job "Creating new gpt partition table on /dev/vda"   ( 4 / 32 )
#     Starting job "Create new 512MiB partition ... with entries EFI" ( 5 / 32 )
#     Starting job "Set flags on partition /dev/vda1"               ( 6 / 32 )
#     Starting job "mount"                                          ( 9 / 32 )
#     Starting job "unpackfs"                                      ( 10 / 32 )
#
# There is no job creating a root partition, and afterwards the disk agreed:
#
#     vda    30G  disk
#     └─vda1 512M part /tmp/calamares-root-1iselbvw/boot/efi
#
# So the target root was an ordinary directory in the live system's tmpfs.
# rsync unpacked 4.7 GB of image into RAM until it ran out and stopped with
# "rsync failed with error code 11" -- an I/O error, which is true and says
# nothing about the cause. The summary page had already shown this: it listed
# four actions, all of them about the EFI partition, and the disk preview said
# "พื้นที่ว่าง 29.50 GiB". Free space, not a filesystem.
#
# Two changes, and the reason for each:
#
#   The layout is written out rather than left to the default. The
#   documentation says an absent partitionLayout means "a single partition for
#   root that uses 100% of the space"; that is not what this build did. Saying
#   it explicitly costs four lines and cannot be misread.
#
#   The EFI settings move into the "efi:" block. efiSystemPartition and
#   efiSystemPartitionSize are the 3.2 spellings -- the same class of mistake
#   as sidebarBackground in the branding and groupsFilePath in netinstall, and
#   the third time this version's renamed keys have cost a build.
---
efi:
    mountPoint:      "/boot/efi"
    # 512 MiB rather than the 300 MiB default: a kernel and its initrd are
    # about 110 MB together here, and an ESP that cannot hold two of them
    # turns the first kernel update into an unbootable machine.
    recommendedSize: 512MiB
    minimumSize:     100MiB
    label:           "EFI"

partitionLayout:
    - name: "mp-root"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%

# R-13: swap is not created here.
#
# Calamares can make a swap file, but it picks the size itself and the rule in
# R-13 -- equal to RAM, capped at 8 GB and at a quarter of the disk, floor
# 2 GB -- is not one of its options. So partitioning makes none, and
# mp-make-swap creates it in the installed system where the rule can be
# applied exactly and checked afterwards.
#
# It also has to be a file inside the root filesystem rather than a partition,
# which matters for R-12: a swap partition sits outside the encrypted volume
# and holds whatever was in memory, in clear. That would leave the disk
# encrypted and its most recently used contents not.
userSwapChoices:
    - none
initialSwapChoice: none

# Pre-select "erase disk" rather than leaving both radio buttons empty with
# the Next button greyed out and nothing saying why.
initialPartitioningChoice: erase

drawNestedPartitions:  false
alwaysShowPartitionLabels: true
defaultFileSystemType: "ext4"

# R-12: offer encryption, do not impose it.
#
# Default off is deliberate. A forgotten passphrase is unrecoverable -- there
# is no reset, no recovery key, and no support call that helps. That has to be
# somebody's own decision rather than something they discover they agreed to.
enableLuksAutomatedPartitioning: true
luksGeneration: luks2

allowManualPartitioning: true
