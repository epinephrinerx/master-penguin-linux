# Keep the installer's own log on the installed system.
#
# This exists because of a question that could not be answered. An install
# with GNOME ticked on the software page finished cleanly and installed none
# of it -- apt's history on the installed system shows only the two commands
# mp-finish-install runs, and no install at all:
#
#     Commandline: apt-get purge -y calamares calamares-settings-ubuntu-common
#     Commandline: apt-get autoremove -y
#
# The reason would have been in the Calamares log, which lives in the live
# session's tmpfs at ~/.cache/calamares/session.log and is gone the moment the
# machine reboots. So the only way to read it was to run the whole install
# again. Once is a lesson; twice would be a choice.
#
# 0600 root:root: the log records the partition layout and every command the
# installer ran, which is not something to leave readable by every account.
---
files:
    - from: log
      dest: /var/log/installer/calamares.log
      perm: root:root:0600
