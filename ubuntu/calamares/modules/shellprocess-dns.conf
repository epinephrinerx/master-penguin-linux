# Give the target system working DNS before anything tries to install into it.
#
# The image's /etc/resolv.conf is a symlink to
# ../run/systemd/resolve/stub-resolv.conf, which is right for a running
# system and wrong for the one Calamares is building: the target's /run is a
# tmpfs this installer mounted a few seconds earlier and nothing has put
# systemd-resolved's socket in it. The symlink dangles, so no name resolves,
# so apt inside the target cannot fetch anything.
#
# dontChroot, because the file worth copying is the live session's -- it has
# whatever the network actually handed out, rather than a guess. cp -L
# follows the live symlink and writes a real file into the target. ROOT is
# set by Calamares to the target's mount point.
#
# The leading "-" makes a failure non-fatal. A machine with no network at all
# should still finish installing; it just will not have anything to download.
# mp-finish-install puts the symlink back, so the installed system goes on
# using systemd-resolved as normal.
---
dontChroot: true
timeout: 30
script:
    - "-/bin/sh -c \"rm -f $ROOT/etc/resolv.conf; cp -L /etc/resolv.conf $ROOT/etc/resolv.conf\""
