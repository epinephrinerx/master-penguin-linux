# Runs in the installed system, after the packages step and before finish.
#
# All the work lives in /usr/local/sbin/mp-finish-install rather than as a list
# of commands here, for two reasons: a shell script can be read and run on its
# own when something goes wrong, and a failure part way through a list of
# inline commands leaves nothing to say which one it was.
---
dontChroot: false
timeout: 900
script:
    - "/usr/local/sbin/mp-finish-install"
