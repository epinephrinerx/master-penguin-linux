# Runs in the installed system, after the packages step.
---
dontChroot: false
timeout: 600
script:
    - "-/usr/bin/update-initramfs -u"
    # casper is only useful on the live disc; leaving it installed makes the
    # installed system look for a squashfs at every boot.
    - "-/usr/bin/apt-get purge -y casper calamares calamares-settings-ubuntu-common"
    - "-/usr/bin/apt-get autoremove -y"
    - "-/bin/rm -f /etc/sudoers.d/mp-live"
    - "-/bin/rm -f /etc/xdg/autostart/mp-install.desktop"
