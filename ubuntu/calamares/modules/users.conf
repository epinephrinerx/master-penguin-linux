# The page the user actually asked for: create the first login during install.
---
defaultGroups:
    - name: adm
    - name: cdrom
    - name: sudo
    - name: dip
    - name: plugdev
    - name: lpadmin
    - name: users

autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    sudo
setRootPassword: false
doReusePassword: false

availableShells: /bin/bash, /bin/sh

userShell: /bin/bash

passwordRequirements:
    minLength: 6
    maxLength: -1
    libpwquality:
        - minlen=6
        - minclass=0
