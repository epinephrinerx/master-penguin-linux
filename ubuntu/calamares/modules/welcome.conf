# The first page. R-10 puts the language choice here, which Calamares already
# renders as a dropdown — it only needs the requirement checks configured
# around it.
---
showSupportUrl:      true
showKnownIssuesUrl:  true
showReleaseNotesUrl: false
showDonateUrl:       false

requirements:
    # Enough for the squashfs plus room to work in. The image unpacks to about
    # 7 GB, so 15 GB leaves space for the swap file from R-13 and a home
    # directory that is not full on day one.
    requiredStorage: 15

    # The live session runs the whole root filesystem from RAM. Below 2 GB it
    # will start, and then the first application to open kills it.
    requiredRam: 2.0

    internetCheckUrl: http://ubuntu.com

    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen

    # Deliberately shorter than the check list. Storage and RAM are refused
    # because installing without them produces a broken system; the rest are
    # warnings.
    #
    # internet is a warning and not a requirement on purpose: the disc carries
    # a complete desktop, media codecs and printing (R-04), so an install with
    # no network works. It only means the optional groups cannot be fetched,
    # and the package page says so.
    required:
        - storage
        - ram
        - root
