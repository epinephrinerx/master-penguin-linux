# Calamares for Master Penguin Linux.
#
# "show" phases are the pages the user clicks through; "exec" phases are the
# work. The user page comes before netinstall so that the account exists before
# anything is installed into the new system.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id:       mp
  module:   shellprocess
  config:   shellprocess-mp.conf
# Runs before "packages", to give the target working DNS. See its config for
# why the image's own /etc/resolv.conf cannot provide it.
- id:       dns
  module:   shellprocess
  config:   shellprocess-dns.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - shellprocess@dns
  - packages
  - shellprocess@mp
  - initramfscfg
  - initramfs
  - grubcfg
  - bootloader
  - preservefiles
  - umount
- show:
  - finished

branding: master-penguin

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
