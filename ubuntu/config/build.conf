# Settings for the Ubuntu-derived track. Override any of these in the
# environment: MP_SUITE=questing ./build.sh

# Ubuntu release to build on. "resolute" is 26.04 LTS.
MP_SUITE="${MP_SUITE:-resolute}"
MP_ARCH="${MP_ARCH:-amd64}"

# A Thai mirror, because that is where this gets built and downloaded from.
# archive.ubuntu.com works everywhere if this one is ever unreachable.
MP_MIRROR="${MP_MIRROR:-http://th.archive.ubuntu.com/ubuntu}"

MP_NAME="${MP_NAME:-Master Penguin Linux}"
MP_ID="${MP_ID:-master-penguin}"
MP_VERSION="${MP_VERSION:-1.0}"

# Everything is built under here; nothing lands in the repo.
# Not under $HOME: this build runs as root, and having the tree move depending
# on who invoked it is a good way to end up with two half-finished chroots.
MP_WORK="${MP_WORK:-/var/tmp/mp-ubuntu}"
MP_CHROOT="$MP_WORK/chroot"
MP_ISODIR="$MP_WORK/iso"
MP_OUT="$MP_WORK/out"

# linux-firmware is ~1.5 GB installed and is most of the ISO. Keep it for real
# hardware (wifi, GPUs); drop it with MP_FIRMWARE=0 for a VM-only image.
MP_FIRMWARE="${MP_FIRMWARE:-1}"

# squashfs compression. zstd is far faster to build and to boot than xz, for a
# few percent more size.
MP_COMP="${MP_COMP:-zstd}"
MP_COMP_LEVEL="${MP_COMP_LEVEL:-19}"

# mksquashfs will happily take every core and several gigabytes of cache,
# which on a machine also running WSL and a VM or two is enough to get the
# build killed by the OOM reaper. Cap both; it costs a little wall-clock and
# nothing else.
MP_SQUASH_MEM="${MP_SQUASH_MEM:-2G}"
MP_SQUASH_PROCS="${MP_SQUASH_PROCS:-$(( $(nproc) / 2 ))}"

# R-05: TH Sarabun New / TH SarabunPSK, fetched at build time because they
# are not in the archive. Licence confirmed: the SIPA / Department of
# Intellectual Property font licence permits redistribution bundled with
# other software, which is what an ISO is. Pinned to a commit so the
# document metrics cannot change underneath a build.
MP_TH_SARABUN_REPO="${MP_TH_SARABUN_REPO:-epsilonxe/SIPAFonts}"
MP_TH_SARABUN_REF="${MP_TH_SARABUN_REF:-0e53affcc75c330397ebf5fb4ff5d4d324826757}"
