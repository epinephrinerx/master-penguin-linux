# noprompt on every entry (R-18).
#
# Without it casper ends a shutdown with "Please remove the installation
# medium, then press ENTER" and waits. In a virtual machine nobody is going
# to press it, so the machine never powers off and looks hung.
#
# What this gives up: on real hardware the prompt is a useful reminder to
# pull the USB stick out. It is given up because the installer sets the
# firmware to boot the installed disk first anyway, and a prompt nobody is
# present to answer is not a reminder, it is a hang.

# Boot menu for the live ISO. @NAME@ and @VERSION@ are filled in at build time.

if loadfont /boot/grub/fonts/unicode.pf2 ; then
    set gfxmode=auto
    insmod all_video
    insmod gfxterm
    terminal_output gfxterm
fi

set default=0
set timeout=10

menuentry "Try @NAME@ @VERSION@" {
    # console=tty1 last so the screen stays the interactive console, while the
    # kernel log also reaches the serial port where a build machine can capture
    # it. Costs nothing on hardware with no serial port.
    linux  /casper/vmlinuz boot=casper noprompt quiet splash console=ttyS0,115200 console=tty1 ---
    initrd /casper/initrd
}

menuentry "Install @NAME@ @VERSION@" {
    linux  /casper/vmlinuz boot=casper noprompt only-ubiquity quiet splash ---
    initrd /casper/initrd
}

menuentry "Try @NAME@ (safe graphics)" {
    linux  /casper/vmlinuz boot=casper noprompt nomodeset quiet splash ---
    initrd /casper/initrd
}

menuentry "Try @NAME@ (verbose, serial console)" {
    linux  /casper/vmlinuz boot=casper noprompt console=ttyS0,115200 console=tty1 ---
    initrd /casper/initrd
}

menuentry "Check disc for defects" {
    linux  /casper/vmlinuz boot=casper noprompt integrity-check quiet splash ---
    initrd /casper/initrd
}
